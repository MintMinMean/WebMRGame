<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>  
    <!-- Import A frame -->

    <script src = " https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.3/dist/aframe-physics-system.min.js " > </script>
    <!-- Import physics  -->
    
    <!-- personal Library -->
    <script src="control.js"></script>
    <script src="addmarker.js"></script>
    <script src="Screenshot_Yae.png"></script>
    <script src="mover.js"></script>
    <script src="paper.js"></script>
    <script src="InitialSetting.js"></script>
    <script src="collision.js"></script>

  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse" physics = "debug: false" >

      <!--เปิดจุดวงกลมตรงกลาง กำหนด raycaster objects ให้ตรงกับคำแนะนำของ A-Frame -->
    <!-- <a-camera>
      <a-cursor raycaster="objects: [data-raycastable]"></a-cursor>
    </a-camera> -->
    <!-- เพิ่ม data-raycastable ที่พื้นผิว เพื่อให้ raycaster ตรวจจับเจอ -->
    <!-- <a-plane target-marker data-raycastable position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane> -->
      <!-- <a-entity id="rightHand" hand-tracking-grab-controls="hand: right"></a-entity>
      <a-entity id="leftHand" hand-tracking-grab-controls="hand: left"></a-entity> -->
    <!-- <a-scene> -->
      <a-entity position="0 5 0">
        <a-box id="Wall" static-body height="10" depth="0.2" width="10" position="5 0 0" rotation="0 90 0" color="#4CC3D9" opacity = "1" color-toggle></a-box>
        <a-box id="Wall" static-body height="10" depth="0.2" width="10" position="-5 0 0" rotation="0 90 0" color="#4CC3D9" opacity = "1" color-toggle></a-box>
        <a-box id="Wall" static-body height="10" depth="0.2" width="10" position="0 0 5" rotation="0 0 0" color="#4CC3D9" opacity = "1" color-toggle></a-box>
        <a-box id="Wall" static-body height="10" depth="0.2" width="10" position="0 0 -5" rotation="0 0 0" color="#4CC3D9" opacity = "1" color-toggle></a-box>
        <a-plane static-body position="0 -5 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4" ></a-plane>
      </a-entity>
      
      <a-box position="-1.5 0.5 -3" rotation="0 45 0" color="#4CC3D9" opacity = "0.5 " target-marker></a-box>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" opacity = "0.5 "></a-box>
      <a-box position="-1 0.5 -3.5" rotation="0 45 0" color="#4CC3D9" opacity = "0.5 "></a-box> 
      <a-sphere collision-handler dynamic-body target-marker src="Screenshot_Yae.png" position="0 1.25 -2" radius=".5" animation="property: rotation; to: 0 360 0; easing: linear; dur: 10000; loop: true"></a-sphere>
      <a-cylinder mover position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      
      <a-sky src="Screenshot_Yae.png"></a-sky>

      <a-entity id="coordinate" position="-8 5 -8" target-marker>
        <a-cone name="x" height="1" radius-bottom="0.1" position="0.5 0 0" rotation="0 0 -90" color="#F54927"></a-cone>
        <a-cone name="y" height="1" radius-bottom="0.1" position="0 .5 0" rotation="0 0 0" color="#27F52A"></a-cone>
        <a-cone name="z" height="1" radius-bottom="0.1" position="0 0 0.5" rotation="90 0 0" color="#2742F5"></a-cone>
        <a-text value="X" position="1 0 0"></a-text>
        <a-text value="Y" position="-0.1 1.1 0"></a-text>
        <a-text value="Z" position="-0.1 0 1"></a-text>
      </a-entity>
      <a-entity id="impModel" position="0 5 -6">
        <a-gltf-model src="monkey.gltf" position="8 0 0" ></a-gltf-model>
      </a-entity>

      <!-- <a-entity id="rig"> 
        <a-entity camera>

        </a-entity>
      </a-entity> -->
      

    </a-scene>
    <script> 
        Logposition("coordinate"); 
        // document.getElementById("coordinate").setAttribute('position', {x: 5})
    </script>
  </body>
</html>
